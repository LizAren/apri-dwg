  <g fill="none" stroke="#3f7fb5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 46 L14 18 L42 46 Z" />
    <path d="M22 46 a24 24 0 0 0 24 -24" stroke="#7db3e0" stroke-width="2.4" />
  </g>
</svg>
